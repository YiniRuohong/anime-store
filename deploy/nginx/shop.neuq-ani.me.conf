server {
    listen 80;
    server_name shop.neuq-ani.me;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}

server {
    listen 443 ssl http2;
    server_name shop.neuq-ani.me;

    # This certificate is used for Cloudflare-to-origin TLS on the current
    # source server. Replace it with a Cloudflare Origin Certificate or public
    # ACME certificate before switching shop.neuq-ani.me back to GoEdge DNS-only.
    ssl_certificate /www/ssl/shop.neuq-ani.me/fullchain.pem;
    ssl_certificate_key /www/ssl/shop.neuq-ani.me/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
